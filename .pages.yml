# Pages CMS configuration (https://pagescms.org/docs/)

media:
- name: papers
  label: Paper PDFs
  input: papers
  output: /papers
  extensions:
  - pdf
- name: files
  label: Files (CV, etc.)
  input: files
  output: /files
- name: images
  label: Images
  input: images
  output: /images
  extensions:
  - png
  - jpg
  - jpeg
  - webp
  - gif
content:
- name: news
  label: News
  type: file
  path: _data/news.yml
  format: yaml
  fields:
  - name: items
    label: News
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} — {text}'
    fields:
    - name: date
      label: Date
      type: string
      required: true
      description: 'e.g. September 2026'
    - name: text
      label: Text
      type: text
      required: true
    - name: href
      label: Link URL
      type: string
      description: Links starting with http open in a new tab
- name: papers
  label: Papers
  type: group
  items:
  - name: refereed
    label: Refereed Articles
    type: file
    path: _data/papers/refereed.yml
    format: yaml
    fields:
    - name: items
      label: Refereed Articles
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: original
        label: Original title (e.g. Japanese)
        type: string
        description: Shown in small text below the English title
      - name: href
        label: Title link
        type: string
        description: Leave empty to link the title to the PDF
      - name: journalName
        label: Journal
        type: string
      - name: journalVol
        label: Volume / issue / year
        type: string
        description: 'e.g. 255, 112571 (2025)'
      - name: year
        label: Year
        type: number
        description: Shown as "(2021)" only when Volume / issue / year is empty
      - name: note
        label: Note
        type: string
        description: 'e.g. Job Market Paper / In Japanese / Refereed'
      - name: coauthors
        label: Coauthors
        type: string
        description: 'e.g. Joint with Yasuhiro Doi'
      - name: pdf
        label: PDF
        type: file
        options:
          media: papers
          extensions:
          - pdf
      - name: doi
        label: DOI
        type: string
        description: 'e.g. https://doi.org/...'
